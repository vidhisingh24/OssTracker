name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: contrib
          POSTGRES_PASSWORD: contrib
          POSTGRES_DB: contrib
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U contrib"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      TEST_DATABASE_URL: postgres://contrib:contrib@localhost:5432/contrib
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Contrast (WCAG AA)
        run: pnpm check:contrast
      - name: Unit + integration tests
        run: pnpm test
      - name: Build
        run: pnpm build
        env:
          DEMO_MODE: "true"
          NODE_ENV: production
      - name: Install Playwright browsers
        run: pnpm --filter @contrib/web exec playwright install --with-deps chromium
      - name: E2E (demo mode)
        run: pnpm e2e
        env:
          DEMO_MODE: "true"
          NODE_ENV: production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
