# Local / single-host deployment: app + worker + postgres.
#   docker compose up --build        → http://localhost:3000 (demo mode until OAuth env is set)
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: contrib
      POSTGRES_PASSWORD: contrib
      POSTGRES_DB: contrib
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contrib"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://contrib:contrib@postgres:5432/contrib
      NODE_ENV: production
      DEMO_MODE: ${DEMO_MODE:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://contrib:contrib@postgres:5432/contrib
      NODE_ENV: production
      DEMO_MODE: ${DEMO_MODE:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
